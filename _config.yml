# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Josh the Coder
#email: your-email@example.com
description: > # this means to ignore newlines until "baseurl:"
  This blog is mostly about code, but also about other stuff!
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://joshthecoder.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: josh_the_coder
github_username:  jadarnel27
# Build in Eastern time on every machine. Post dates (and so post URLs) depend on it, and GitHub's
# build machines run on UTC: without this, a post dated 20:22 -0400 moves to the next day's URL.
timezone: America/New_York

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
google_analytics_four: G-B66B7V2RDY
disqus:
    shortname: joshthecoder

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude: [
    Gemfile, Gemfile.lock, node_modules, vendor/bundle/, # Defaults
    vendor/cache/, vendor/gems/, vendor/ruby/, # Defaults
    build-prod.sh, 
    deploy.sh,
    README.md, 
    serve.sh,
    wrangler.jsonc # Cloudflare deploy config, not part of the site
  ]

# Copied into _site/ even though they start with "_": Cloudflare reads them at deploy time
# (response headers and redirects). They aren't served as pages.
include: [_headers, _redirects]
